<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ponsphaera — Party</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap');

  :root{
    --bg: #ffffff;
    --green: #39ff8c;
    --blue: #2bd9ff;
    --navy: #0a1830;
    --gold: #d9b34a;
    --ink-soft: #5a6472;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html{ scroll-behavior: smooth; }

  body{
    background: var(--bg);
    font-family: 'Space Grotesk', sans-serif;
    color: var(--navy);
    overflow-x: hidden;
  }

  /* ---------- HERO ---------- */
  .hero{
    height: 100vh;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    background: var(--bg);
  }

  .hero-eyebrow{
    font-size: 13px;
    letter-spacing: 0.35em;
    color: var(--ink-soft);
    margin-bottom: 18px;
    text-transform: uppercase;
  }

  .party-text{
    font-family: 'Anton', sans-serif;
    font-size: clamp(4.5rem, 18vw, 13rem);
    line-height: 0.9;
    letter-spacing: 0.02em;
    text-align: center;
    background: linear-gradient(100deg, var(--green) 0%, var(--green) 40%, var(--blue) 60%, var(--blue) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 6px rgba(57,255,140,0.45)) drop-shadow(0 0 26px rgba(43,217,255,0.35));
    animation: flicker 4.5s ease-in-out infinite;
    user-select: none;
  }

  @keyframes flicker{
    0%, 100% { filter: drop-shadow(0 0 6px rgba(57,255,140,0.45)) drop-shadow(0 0 26px rgba(43,217,255,0.35)); }
    50% { filter: drop-shadow(0 0 10px rgba(57,255,140,0.65)) drop-shadow(0 0 38px rgba(43,217,255,0.55)); }
  }

  .hero-sub{
    margin-top: 22px;
    font-size: 15px;
    color: var(--ink-soft);
    letter-spacing: 0.08em;
    text-align: center;
  }

  .scroll-cue{
    position: absolute;
    bottom: 38px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: var(--ink-soft);
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
  }

  .scroll-cue .line{
    width: 1px;
    height: 34px;
    background: linear-gradient(to bottom, var(--green), var(--blue));
    animation: drop 1.8s ease-in-out infinite;
  }

  @keyframes drop{
    0% { transform: scaleY(0.3); opacity: 0.3; }
    50% { transform: scaleY(1); opacity: 1; }
    100% { transform: scaleY(0.3); opacity: 0.3; }
  }

  /* ---------- EVENTS SECTION ---------- */
  .events{
    background: var(--navy);
    padding: 100px 24px 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .events-heading{
    text-align: center;
    margin-bottom: 60px;
  }

  .events-eyebrow{
    font-size: 12px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 14px;
  }

  .events-title{
    font-family: 'Anton', sans-serif;
    font-size: clamp(2.2rem, 5vw, 3.6rem);
    color: #ffffff;
    letter-spacing: 0.01em;
  }

  .events-title span{
    background: linear-gradient(100deg, var(--green), var(--blue));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .flyer-frame{
    width: 100%;
    max-width: 560px;
    aspect-ratio: 1 / 1;
    border-radius: 18px;
    overflow: hidden;
    position: relative;
    background: #0d2143;
    border: 1px solid rgba(57,255,140,0.18);
  }

  .flyer-frame::before{
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--green), var(--blue));
    z-index: 2;
  }

  .flyer-img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .footer-note{
    margin-top: 48px;
    font-size: 12px;
    color: rgba(255,255,255,0.35);
    text-align: center;
    letter-spacing: 0.05em;
  }

  @media (max-width: 540px){
    .flyer-frame{ max-width: 100%; }
  }
</style>
</head>
<body>

  <section class="hero">
    <div class="hero-eyebrow">Ponsphaera</div>
    <div class="party-text">PARTY</div>
    <div class="scroll-cue">
      <span>Scroll</span>
      <div class="line"></div>
    </div>
  </section>

  <section class="events">
    <div class="events-heading">
      <div class="events-eyebrow">Upcoming</div>
      <div class="events-title">What's <span>Next</span></div>
    </div>

    <div class="flyer-frame">
      <img src="flyer.png" alt="Event flyer" class="flyer-img">
    </div>

    <div class="footer-note">More events drop soon — stay tuned.</div>
  </section>

</body>
</html>
