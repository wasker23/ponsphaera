<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ponsphaera — Gallery</title>
<meta name="description" content="Photos from Ponsphaera events — Miami's premier lifestyle experience. Pool parties, brunches, socials, and more.">
<link rel="icon" type="image/png" href="../favicon.jpg">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap');

  :root{
    --bg: #ffffff;
    --green: #39ff8c;
    --blue: #2bd9ff;
    --navy: #0a1830;
    --gold: #d9b34a;
    --ink-soft: #5a6472;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html{ scroll-behavior: smooth; }

  body{
    background: var(--navy);
    font-family: 'Space Grotesk', sans-serif;
    color: #ffffff;
    overflow-x: hidden;
  }

  /* ---------- NAV ---------- */
  .nav{
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(10,24,48,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(57,255,140,0.12);
  }

  .nav-logo{
    font-family: 'Anton', sans-serif;
    font-size: 20px;
    letter-spacing: 0.08em;
    background: linear-gradient(100deg, var(--green), var(--blue));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-decoration: none;
  }

  .nav-back{
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.6);
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .nav-back:hover{ color: var(--green); }

  .nav-back svg{
    width: 16px;
    height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
  }

  /* ---------- HERO ---------- */
  .hero{
    padding: 160px 24px 80px;
    text-align: center;
  }

  .hero-eyebrow{
    font-size: 12px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 16px;
  }

  .hero-title{
    font-family: 'Anton', sans-serif;
    font-size: clamp(3rem, 8vw, 6rem);
    line-height: 0.95;
    letter-spacing: 0.02em;
    background: linear-gradient(100deg, var(--green), var(--blue));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 6px rgba(57,255,140,0.35)) drop-shadow(0 0 24px rgba(43,217,255,0.25));
    margin-bottom: 20px;
  }

  .hero-sub{
    font-size: 15px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.06em;
  }

  /* ---------- GRID ---------- */
  .gallery-section{
    padding: 40px 24px 120px;
    max-width: 1300px;
    margin: 0 auto;
  }

  .photo-grid{
    position: relative;
    width: 100%;
    min-height: 2400px;
  }

  .photo-item{
    position: absolute;
    width: 260px;
    border-radius: 12px;
    overflow: hidden;
    background: #0d2143;
    border: 1px solid rgba(57,255,140,0.12);
    cursor: pointer;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    transition: transform 0.3s ease, box-shadow 0.3s ease, z-index 0s;
    z-index: 1;
  }

  .photo-item:hover{
    transform: scale(1.08) rotate(0deg) !important;
    box-shadow: 0 16px 48px rgba(0,0,0,0.6);
    z-index: 10;
  }

  .photo-item::before{
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--green), var(--blue));
    z-index: 2;
  }

  .photo-item img{
    width: 100%;
    height: auto;
    display: block;
  }

  .photo-item .overlay{
    position: absolute;
    inset: 0;
    background: rgba(10,24,48,0);
    transition: background 0.3s ease;
    z-index: 1;
  }

  .photo-item:hover .overlay{
    background: rgba(10,24,48,0.2);
  }

  @media (max-width: 700px){
    .photo-item{ width: 160px; }
    .photo-grid{ min-height: 3200px; }
    .nav{ padding: 16px 20px; }
  }

  /* ---------- EMPTY STATE ---------- */
  .empty-state{
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 24px;
    gap: 16px;
    text-align: center;
  }

  .empty-icon{
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--green), var(--blue));
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
  }

  .empty-icon svg{
    width: 28px;
    height: 28px;
    stroke: var(--navy);
    fill: none;
    stroke-width: 2;
  }

  .empty-title{
    font-family: 'Anton', sans-serif;
    font-size: 1.8rem;
    color: #ffffff;
  }

  .empty-sub{
    font-size: 14px;
    color: rgba(255,255,255,0.45);
    max-width: 320px;
    line-height: 1.6;
  }

  /* ---------- LIGHTBOX ---------- */
  .lightbox{
    position: fixed;
    inset: 0;
    background: rgba(10,24,48,0.95);
    z-index: 999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .lightbox.active{ display: flex; }

  .lightbox img{
    max-width: 90vw;
    max-height: 90vh;
    object-fit: contain;
    border-radius: 12px;
  }

  .lightbox-close{
    position: absolute;
    top: 24px;
    right: 24px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease;
  }

  .lightbox-close:hover{ background: rgba(255,255,255,0.2); }

  .lightbox-close svg{
    width: 20px;
    height: 20px;
    stroke: #ffffff;
    fill: none;
    stroke-width: 2;
  }

  /* ---------- FOOTER ---------- */
  .footer{
    text-align: center;
    padding: 40px 24px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.08em;
  }

  @media (max-width: 700px){
    .nav{ padding: 16px 20px; }
  }
</style>
</head>
<body>

  <!-- NAV -->
  <nav class="nav">
    <a href="../" class="nav-logo">Ponsphaera</a>
    <a href="../" class="nav-back">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
      Back to events
    </a>
  </nav>

  <!-- HERO -->
  <div class="hero">
    <div class="hero-eyebrow">Ponsphaera</div>
    <div class="hero-title">Gallery</div>
    <div class="hero-sub">Unforgettable moments from our past events</div>
  </div>

  <!-- PHOTO GRID -->
  <section class="gallery-section">
    <div class="photo-grid" id="photoGrid">

      <div class="photo-item" onclick="openLightbox(this)">
        <div class="overlay"></div>
        <img src="1.jpg" alt="Ponsphaera event photo">
      </div>
      <div class="photo-item" onclick="openLightbox(this)">
        <div class="overlay"></div>
        <img src="2.jpg" alt="Ponsphaera event photo">
      </div>
      <div class="photo-item" onclick="openLightbox(this)">
        <div class="overlay"></div>
        <img src="3.jpg" alt="Ponsphaera event photo">
      </div>
      <div class="photo-item" onclick="openLightbox(this)">
        <div class="overlay"></div>
        <img src="4.jpg" alt="Ponsphaera event photo">
      </div>
      <div class="photo-item" onclick="openLightbox(this)">
        <div class="overlay"></div>
        <img src="5.jpg" alt="Ponsphaera event photo">
      </div>
      <div class="photo-item" onclick="openLightbox(this)">
        <div class="overlay"></div>
        <img src="10.jpg" alt="Ponsphaera event photo">
      </div>
      <div class="photo-item" onclick="openLightbox(this)">
        <div class="overlay"></div>
        <img src="14.jpg" alt="Ponsphaera event photo">
      </div>
      <div class="photo-item" onclick="openLightbox(this)">
        <div class="overlay"></div>
        <img src="15.jpg" alt="Ponsphaera event photo">
      </div>
      <div class="photo-item" onclick="openLightbox(this)">
        <div class="overlay"></div>
        <img src="17.jpg" alt="Ponsphaera event photo">
      </div>
      <div class="photo-item" onclick="openLightbox(this)">
        <div class="overlay"></div>
        <img src="18.jpg" alt="Ponsphaera event photo">
      </div>
      <div class="photo-item" onclick="openLightbox(this)">
        <div class="overlay"></div>
        <img src="19.jpg" alt="Ponsphaera event photo">
      </div>
      <div class="photo-item" onclick="openLightbox(this)">
        <div class="overlay"></div>
        <img src="20.jpg" alt="Ponsphaera event photo">
      </div>

    </div>
  </section>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <img id="lightboxImg" src="" alt="">
  </div>

  <!-- FOOTER -->
  <div class="footer">© Ponsphaera — Join the Lifestyle</div>

  <script>
    const isMobile = window.innerWidth <= 700;

    function scatterPhotos() {
      const grid = document.getElementById('photoGrid');
      const items = grid.querySelectorAll('.photo-item');
      const gridWidth = grid.offsetWidth;
      const mobile = window.innerWidth <= 700;
      const photoWidth = mobile ? 130 : 260;
      const maxRot = mobile ? 5 : 7;
      const cols = mobile ? 2 : 3;
      const rowHeight = mobile ? 180 : 300;
      const padding = mobile ? 8 : 20;
      const colWidth = (gridWidth - padding * (cols + 1)) / cols;
      const totalRows = Math.ceil(items.length / cols);

      grid.style.minHeight = (totalRows * rowHeight + (mobile ? 150 : 200)) + 'px';

      items.forEach(function(item, i) {
        item.style.width = photoWidth + 'px';
        const col = i % cols;
        const row = Math.floor(i / cols);
        const baseX = padding + col * (colWidth + padding);
        const baseY = row * rowHeight + padding;
        const randX = baseX + (Math.random() * (colWidth - photoWidth) * 0.6);
        const randY = baseY + (Math.random() * (mobile ? 30 : 60));
        const randRot = (Math.random() * maxRot * 2) - maxRot;
        const clampedX = Math.max(padding, Math.min(randX, gridWidth - photoWidth - padding));

        item.style.left = clampedX + 'px';
        item.style.top = randY + 'px';
        item.style.transform = 'rotate(' + randRot + 'deg)';
      });
    }

    window.addEventListener('load', scatterPhotos);
    window.addEventListener('resize', scatterPhotos);

    // Lightbox — works for both click and touch
    function openLightbox(el) {
      const img = el.querySelector('img');
      document.getElementById('lightboxImg').src = img.src;
      document.getElementById('lightbox').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
      document.body.style.overflow = '';
    }

    // Tap to straighten on mobile, then tap again to open
    document.querySelectorAll('.photo-item').forEach(function(item) {
      let tapped = false;
      item.addEventListener('touchend', function(e) {
        if (!tapped) {
          e.preventDefault();
          item.style.transform = 'rotate(0deg) scale(1.05)';
          item.style.zIndex = 10;
          tapped = true;
          setTimeout(function() {
            tapped = false;
          }, 2000);
        } else {
          openLightbox(item);
        }
      });
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>

</body>
</html>
