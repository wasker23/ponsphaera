<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script>
(function () {
  fetch('/gallery/index.html')
    .then(function (r) { return r.text(); })
    .then(function (html) {
      var parser = new DOMParser();
      var doc = parser.parseFromString(html, 'text/html');
      var cards = Array.from(doc.querySelectorAll('.event-card[data-event-end]'));
      var now = new Date();
      var upcoming = cards
        .filter(function (c) { return new Date(c.dataset.eventEnd) > now; })
        .sort(function (a, b) { return new Date(a.dataset.eventEnd) - new Date(b.dataset.eventEnd); });
      if (upcoming.length > 0) {
        var img = upcoming[0].querySelector('.flyer-wrap img');
        if (img) {
          window.location.replace('/gallery/' + img.getAttribute('src'));
        }
      }
    });
})();
</script>
</head>
<body></body>
</html>
